name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, and debug/release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run hardware-free checks
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Verify offline release manifest
        run: |
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$manifest"; then
            echo "Release manifest unexpectedly grants network access."
            exit 1
          fi
